plugins {
    id 'com.android.application'
}

android {
    namespace 'com.skyworthdigital.autostart'
    compileSdk 34

    defaultConfig {
        // Some TV firmwares keep a package-name allowlist of HOME candidates. Override the identity with
        // -PlauncherApplicationId=<id> if this build is filtered out of the HOME list.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.skyworthdigital.autostart')
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sideloaded over ADB, never published: sign with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
